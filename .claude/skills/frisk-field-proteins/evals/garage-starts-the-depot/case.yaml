schema_version: "1.1"
name: garage-starts-the-depot
expected_outcome: |
  Builds a process combining a garage release with the depot loop, reusing the existing classes (Driver, Package, Crate, Post, Dock, Dock wall, Key, Garage, Garage charge) rather than inventing new ones. Keeps the parts insulated (more than about 7 cells apart, or orthogonal levels) and explains why the released drivers reach the depot. Shows by running seeds that with the key every load is delivered most of the time, and that with no key nothing is delivered. Existing tests pass and existing worlds' fingerprints are unchanged.
context:
  scaffold_script: place-files.sh
